<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="description" content="EU AI Act Glossar – zweisprachiges KI-Lexikon. Offline-fähig. Learning Factory." />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#f8f5ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0a1628" media="(prefers-color-scheme: dark)" />

<!-- iOS-spezifisch -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="AI Act" />
<link rel="apple-touch-icon" href="icon-192.png" />

<title>EU AI Act · Glossar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #0a1628;
    --ink-2: #1c2d4a;
    --paper: #f8f5ee;
    --paper-warm: #efe8d8;
    --paper-deep: #e6dcc6;
    --accent: #c8a96a;
    --accent-deep: #9c7f3f;
    --rule: rgba(22, 36, 71, .12);
    --rule-strong: rgba(22, 36, 71, .24);
    --muted: #5a6470;
    --muted-2: #828a94;
    --bg: var(--paper);
    --surface: var(--paper);
    --surface-2: var(--paper-warm);
    --text: var(--ink);
    --text-2: var(--ink-2);

    --risk-prohibited: #b91c1c;
    --risk-high: #d97706;
    --risk-limited: #b45309;
    --risk-minimal: #15803d;
    --risk-systemic: #6d28d9;
    --risk-na: #475569;

    --cat-act:    #162447;
    --cat-ml:     #0e7490;
    --cat-dl:     #6d28d9;
    --cat-llm:    #be185d;
    --cat-nlp:    #047857;
    --cat-cv:     #c2410c;
    --cat-ethics: #9c7f3f;
    --cat-gov:    #1e3a8a;
    --cat-sec:    #b91c1c;

    /* Safe areas (iPhone-Notch) */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1628;
      --surface: #14213d;
      --surface-2: #1c2d4a;
      --text: #f0e9d8;
      --text-2: #d4cdb8;
      --rule: rgba(248, 245, 238, .10);
      --rule-strong: rgba(248, 245, 238, .22);
      --muted: #9aa3ae;
      --muted-2: #6a7280;
      --paper-warm: #1c2d4a;
      --ink: #f0e9d8;
      --ink-2: #d4cdb8;
    }
  }

  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    min-height: 100vh;
    min-height: 100dvh;
    padding-left: var(--safe-left);
    padding-right: var(--safe-right);
  }
  ::selection { background: var(--accent); color: var(--ink); }

  /* ----------- HEADER (B+D Hybrid) -----------
     Aufbau: 
     - .topbar ist sticky am oberen Rand
     - .cover ist der große Magazin-Cover-Block (sichtbar am Anfang)
     - .compact ist die kompakte Verlagswappen-Variante (erscheint beim Scrollen)
     - .topbar.scrolled blendet cover aus und compact ein
  */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--ink);
    color: var(--paper-warm);
    padding-top: var(--safe-top);
    transition: background .3s ease;
    box-shadow: 0 2px 0 var(--accent);
  }
  .topbar::before {
    /* Subtile Tiefe: Verlauf von tiefem ins normale Navy */
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 0% 0%, rgba(200,169,106,.12) 0%, transparent 45%),
      radial-gradient(ellipse at 100% 100%, rgba(200,169,106,.06) 0%, transparent 50%);
    pointer-events: none;
    transition: opacity .3s ease;
  }
  .topbar.scrolled::before { opacity: .35; }

  /* ----------- COVER (initial, D-Stil) ----------- */
  .cover {
    position: relative; z-index: 1;
    padding: 18px 16px 14px;
    overflow: hidden;
    max-height: 260px;
    transition: max-height .35s cubic-bezier(.32,.72,0,1),
                padding .3s ease,
                opacity .25s ease;
  }
  .topbar.scrolled .cover {
    max-height: 0;
    padding-top: 0; padding-bottom: 0;
    opacity: 0;
    pointer-events: none;
  }
  .cover-top-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .cover-edition {
    font: 700 10px/1 "Manrope", sans-serif;
    text-transform: uppercase;
    letter-spacing: .15em;
    color: var(--accent);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .cover-edition::before {
    content: ""; width: 14px; height: 1px; background: var(--accent);
  }
  .cover-title {
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: clamp(28px, 8.5vw, 36px);
    line-height: .95;
    letter-spacing: -.025em;
    color: var(--paper);
    margin: 0;
  }
  .cover-title em {
    font-style: italic; font-weight: 500;
    color: var(--accent);
  }
  .cover-subtitle {
    font: 500 13.5px/1.4 "Manrope", sans-serif;
    color: rgba(240, 233, 216, .68);
    margin: 8px 0 14px;
    max-width: 32ch;
  }
  .cover-meta-row {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 12px;
    border-top: 1px solid rgba(200,169,106,.28);
    font: 700 10px/1 "Manrope", sans-serif;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: rgba(240,233,216,.55);
  }
  .cover-meta-row .accent { color: var(--accent); }

  /* ----------- COMPACT (beim Scrollen, B-Stil) ----------- */
  .compact {
    position: relative; z-index: 1;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height .35s cubic-bezier(.32,.72,0,1),
                padding .3s ease,
                opacity .25s ease .05s;
  }
  .topbar.scrolled .compact {
    max-height: 80px;
    opacity: 1;
  }
  .compact-row {
    display: flex; align-items: center;
    padding: 12px 16px 12px;
    gap: 12px;
  }
  .compact-eyebrow {
    font: 700 9px/1 "Manrope", sans-serif;
    text-transform: uppercase;
    letter-spacing: .15em;
    color: var(--accent);
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 2px;
  }
  .compact-eyebrow::before {
    content: ""; width: 12px; height: 1px; background: var(--accent);
  }
  .compact-brand {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
  }
  .compact-title {
    font-family: "Fraunces", serif;
    font-weight: 700; font-size: 16px;
    color: var(--paper);
    line-height: 1.1;
    letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .compact-title em { font-style: italic; font-weight: 500; color: var(--accent); }

  /* ----------- LANG-SWITCH (für beide Modi gleich) ----------- */
  .lang-switch {
    display: flex;
    border: 1px solid rgba(248, 245, 238, .22);
    border-radius: 8px; overflow: hidden;
    flex-shrink: 0; height: 32px;
  }
  .lang-btn {
    border: 0; background: transparent;
    padding: 0 12px;
    font-family: inherit; font-size: 11px;
    font-weight: 700; letter-spacing: .08em;
    cursor: pointer; color: rgba(240,233,216,.65);
    min-width: 40px; min-height: 32px;
    display: grid; place-items: center;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    transition: background .15s ease, color .15s ease;
  }
  .lang-btn:active { background: rgba(248,245,238,.12); }
  .lang-btn.active { background: var(--accent); color: var(--ink); }


  /* ----------- SEARCH (sticky, im dunklen Header) ----------- */
  .search-wrap {
    padding: 0 16px 10px;
    position: relative;
    z-index: 1;
  }
  .search-wrap svg {
    position: absolute;
    left: 28px; top: 50%;
    transform: translateY(-50%);
    color: rgba(240,233,216,.55); pointer-events: none;
  }
  #searchInput {
    width: 100%;
    padding: 12px 14px 12px 42px;
    border: 1px solid rgba(248, 245, 238, .18);
    background: rgba(248, 245, 238, .08);
    color: var(--paper);
    border-radius: 10px;
    font-family: inherit; font-size: 16px;
    -webkit-appearance: none;
    height: 44px;
  }
  #searchInput:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(248, 245, 238, .12);
    box-shadow: 0 0 0 3px rgba(200,169,106,.2);
  }
  #searchInput::placeholder { color: rgba(240,233,216,.45); }

  /* ----------- FILTER (horizontal scroll, im dunklen Header) ----------- */
  .filter-scroll {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding: 0 16px 14px;
    scroll-padding-left: 16px;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
    -ms-overflow-style: none;
    position: relative;
    z-index: 1;
  }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-scroll::after {
    content: "";
    flex: 0 0 4px;
  }
  .chip {
    border: 1px solid rgba(248, 245, 238, .18);
    background: rgba(248, 245, 238, .06);
    color: var(--paper-warm);
    padding: 0 12px;
    font-family: inherit; font-size: 13px;
    font-weight: 500;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    height: 34px;
    display: inline-flex; align-items: center; gap: 6px;
    scroll-snap-align: start;
    transition: all .15s ease;
  }
  .chip:active {
    background: rgba(248, 245, 238, .12);
  }
  .chip.active {
    background: var(--accent);
    color: var(--ink);
    border-color: var(--accent);
  }
  .chip .count { font-size: 11px; opacity: .65; font-weight: 400; }
  .chip-risk { padding-left: 10px; }
  .chip-risk::before {
    content: ""; width: 7px; height: 7px;
    border-radius: 50%; background: var(--risk-na);
    display: inline-block;
  }
  .chip-risk[data-risk="prohibited"]::before { background: var(--risk-prohibited); }
  .chip-risk[data-risk="high"]::before       { background: var(--risk-high); }
  .chip-risk[data-risk="limited"]::before    { background: var(--risk-limited); }
  .chip-risk[data-risk="minimal"]::before    { background: var(--risk-minimal); }
  .chip-risk[data-risk="systemic"]::before   { background: var(--risk-systemic); }

  .filter-divider {
    height: 12px; width: 1px;
    background: var(--rule-strong);
    margin: 0 4px;
    align-self: center;
    flex-shrink: 0;
  }

  /* ----------- LIST ----------- */
  main {
    padding: 8px 12px calc(40px + var(--safe-bot));
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .stats {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .1em;
    padding: 4px 4px 8px;
    font-weight: 600;
  }
  .term-card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 16px 14px 14px;
    cursor: pointer;
    transition: transform .12s ease, background .15s, border-color .15s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .term-card:active {
    transform: scale(.985);
    background: var(--surface-2);
  }
  .term-card:hover {
    border-color: var(--rule-strong);
  }
  .expand-hint {
    position: absolute;
    right: 12px; bottom: 12px;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--accent-deep);
    font-size: 14px;
    line-height: 1;
    pointer-events: none;
    transition: all .15s ease;
  }
  .term-card:active .expand-hint {
    background: var(--accent);
    color: var(--ink);
  }
  .term-meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .cat-pill {
    padding: 3px 8px; border-radius: 4px;
    background: var(--ink); color: var(--paper-warm);
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .cat-pill[data-cat="ai-act-core"] { background: var(--cat-act); }
  .cat-pill[data-cat="ml"]          { background: var(--cat-ml); }
  .cat-pill[data-cat="dl"]          { background: var(--cat-dl); }
  .cat-pill[data-cat="llm"]         { background: var(--cat-llm); }
  .cat-pill[data-cat="nlp"]         { background: var(--cat-nlp); }
  .cat-pill[data-cat="cv"]          { background: var(--cat-cv); }
  .cat-pill[data-cat="ethics"]      { background: var(--cat-ethics); }
  .cat-pill[data-cat="governance"]  { background: var(--cat-gov); }
  .cat-pill[data-cat="security"]    { background: var(--cat-sec); }

  .risk-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted);
  }
  .risk-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--risk-na);
  }
  .risk-dot[data-risk="prohibited"] { background: var(--risk-prohibited); }
  .risk-dot[data-risk="high"]       { background: var(--risk-high); }
  .risk-dot[data-risk="limited"]    { background: var(--risk-limited); }
  .risk-dot[data-risk="minimal"]    { background: var(--risk-minimal); }
  .risk-dot[data-risk="systemic"]   { background: var(--risk-systemic); }

  .term-title {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 19px; line-height: 1.2;
    letter-spacing: -.01em;
    margin: 0 0 6px;
    color: var(--text);
  }
  .term-short {
    font-size: 14px; color: var(--text-2);
    line-height: 1.45;
    margin: 0;
    padding-right: 32px;
  }

  /* ----------- BOTTOM SHEET ----------- */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(10,22,40,.5);
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
    backdrop-filter: blur(2px);
  }
  .sheet-backdrop.open {
    opacity: 1; pointer-events: auto;
  }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 101;
    background: var(--bg);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,.72,0,1);
    max-height: 92dvh;
    display: flex; flex-direction: column;
    box-shadow: 0 -8px 32px rgba(10,22,40,.18);
    padding-bottom: var(--safe-bot);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--rule-strong);
    border-radius: 2px;
    margin: 10px auto 4px;
    flex-shrink: 0;
  }
  .sheet-header {
    padding: 8px 20px 12px;
    border-bottom: 1px solid var(--rule);
    flex-shrink: 0;
  }
  .sheet-meta {
    display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap; margin-bottom: 10px;
  }
  .sheet-title {
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 24px; line-height: 1.15;
    letter-spacing: -.015em;
    margin: 0; color: var(--text);
  }
  .sheet-alt {
    font-size: 13px; color: var(--muted);
    font-style: italic;
    margin-top: 4px;
  }
  .sheet-body {
    flex: 1; overflow-y: auto;
    padding: 16px 20px 24px;
    -webkit-overflow-scrolling: touch;
  }
  .sheet-section-label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: .14em; color: var(--muted);
    font-weight: 700;
    margin: 0 0 8px;
  }
  .sheet-short {
    font-size: 15.5px; color: var(--text);
    line-height: 1.55;
    margin: 0 0 18px;
    padding: 12px 14px;
    background: var(--surface-2);
    border-radius: 10px;
    border-left: 3px solid var(--accent);
  }
  .sheet-long {
    font-size: 15px; color: var(--text-2);
    line-height: 1.65;
    margin: 0 0 20px;
  }
  .sheet-tags {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-bottom: 20px;
  }
  .tag {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: var(--accent-deep);
    background: rgba(200,169,106,.13);
    padding: 4px 8px; border-radius: 4px;
    border: 0; cursor: pointer;
    min-height: 28px;
  }
  .tag.active { background: var(--accent-deep); color: var(--paper); }

  .sheet-links a {
    display: flex; align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    margin-bottom: 6px;
    background: var(--surface-2);
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px; font-weight: 500;
    min-height: 44px;
  }
  .sheet-links a::after {
    content: "↗"; opacity: .5;
    flex-shrink: 0;
  }
  .sheet-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 0;
    background: var(--surface-2);
    color: var(--text);
    font-size: 18px; line-height: 1;
    cursor: pointer;
    display: grid; place-items: center;
  }

  /* ----------- INSTALL PROMPT ----------- */
  .install-banner {
    position: fixed;
    left: 16px; right: 16px;
    bottom: calc(16px + var(--safe-bot));
    background: var(--ink);
    color: var(--paper-warm);
    border-radius: 14px;
    padding: 14px 16px;
    z-index: 90;
    box-shadow: 0 8px 32px rgba(10,22,40,.25);
    display: none;
    align-items: center; gap: 12px;
    animation: slideUp .4s cubic-bezier(.32,.72,0,1);
  }
  .install-banner.show { display: flex; }
  .install-banner-text {
    flex: 1; font-size: 13px; line-height: 1.4;
  }
  .install-banner-text strong {
    font-family: "Fraunces", serif;
    font-size: 14px; display: block;
    margin-bottom: 2px;
  }
  .install-btn {
    border: 0;
    background: var(--accent);
    color: var(--ink);
    font-family: inherit; font-weight: 700;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
    min-height: 36px;
  }
  .install-dismiss {
    background: transparent; border: 0;
    color: var(--paper-warm); opacity: .6;
    font-size: 18px; line-height: 1;
    cursor: pointer; padding: 4px 8px;
    flex-shrink: 0;
  }

  @keyframes slideUp {
    from { transform: translateY(120%); }
    to { transform: translateY(0); }
  }

  /* ----------- EMPTY ----------- */
  .empty {
    text-align: center;
    padding: 60px 24px;
    color: var(--muted);
  }
  .empty h3 {
    font-family: "Fraunces", serif;
    font-size: 22px; color: var(--text);
    margin: 0 0 6px;
  }

  mark { background: rgba(200,169,106,.35); color: inherit; padding: 0 2px; border-radius: 2px; }

  /* Tablets: zwei Spalten */
  @media (min-width: 700px) {
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 16px; }
    .stats { grid-column: 1 / -1; }
    .empty { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<header class="topbar" id="topbar">

  <!-- COVER: großer Magazin-Cover-Block, sichtbar beim Start -->
  <div class="cover">
    <div class="cover-top-row">
      <span class="cover-edition" data-i18n="coverEdition">EDITION 2026 · BAND I</span>
      <div class="lang-switch" role="group" aria-label="Sprache">
        <button class="lang-btn" data-lang="de">DE</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
    <h1 class="cover-title" data-i18n-html="coverTitle">EU AI Act<br/><em>Glossar</em></h1>
    <p class="cover-subtitle" data-i18n="coverSubtitle">Das zweisprachige Lexikon zur Verordnung (EU) 2024/1689.</p>
    <div class="cover-meta-row">
      <span data-i18n="coverPublisher">Learning Factory</span>
      <span class="accent"><span id="coverCount">53</span> <span data-i18n="coverCountLabel">Begriffe · DE / EN</span> · v1.4 DIAG</span>
    </div>
  </div>

  <!-- COMPACT: kompakte Verlagsleiste, erscheint beim Scrollen -->
  <div class="compact">
    <div class="compact-row">
      <div class="compact-brand">
        <span class="compact-eyebrow" data-i18n="compactEyebrow">VO (EU) 2024/1689</span>
        <span class="compact-title" data-i18n-html="compactTitle">EU AI Act <em>Glossar</em></span>
      </div>
      <div class="lang-switch" role="group" aria-label="Sprache">
        <button class="lang-btn" data-lang="de">DE</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </div>

  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" />
  </div>

  <div class="filter-scroll" id="filterScroll"></div>
</header>

<main id="main">
  <div class="stats" id="stats">—</div>
</main>

<!-- Bottom Sheet für Detail -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheetClose" aria-label="Schließen">×</button>
  <div class="sheet-header" id="sheetHeader"></div>
  <div class="sheet-body" id="sheetBody"></div>
</aside>

<!-- Install-Banner -->
<div class="install-banner" id="installBanner">
  <div class="install-banner-text">
    <strong data-i18n="installTitle">App installieren</strong>
    <span data-i18n="installText">Offline lesen, schneller starten.</span>
  </div>
  <button class="install-btn" id="installBtn" data-i18n="installBtn">Installieren</button>
  <button class="install-dismiss" id="installDismiss" aria-label="Schließen">×</button>
</div>

<script src="terms.js?v=1.4"></script>

<script>
/* ==================================================================
   I18N
================================================================== */
const I18N = {
  de: {
    brandTitle: "EU AI Act Glossar",
    brandSub: "Edition 2026",
    coverEdition: "EDITION 2026 · BAND I",
    coverTitle: 'EU AI Act<br/><em>Glossar</em>',
    coverSubtitle: "Das zweisprachige Lexikon zur Verordnung (EU) 2024/1689.",
    coverPublisher: "Learning Factory",
    coverCountLabel: "Begriffe · DE / EN",
    compactEyebrow: "VO (EU) 2024/1689",
    compactTitle: 'EU AI Act <em>Glossar</em>',
    searchPlaceholder: "Begriff, Tag, Stichwort…",
    catAll: "Alle",
    cat: {
      "ai-act-core": "EU AI Act",
      "ml": "ML-Grundlagen",
      "dl": "Deep Learning",
      "llm": "LLM / GenAI",
      "nlp": "NLP",
      "cv": "Vision",
      "ethics": "Ethik",
      "governance": "Governance",
      "security": "Sicherheit"
    },
    risk: {
      "prohibited": "Verboten",
      "high": "Hochrisiko",
      "limited": "Begrenzt",
      "minimal": "Minimal",
      "systemic": "Systemisch"
    },
    statResults: "Begriffe",
    detailKurz: "Kurzdefinition",
    detailLang: "Im Detail",
    detailLinks: "Quellen",
    emptyTitle: "Keine Treffer",
    emptyText: "Versuche es mit einem anderen Suchbegriff oder setze die Filter zurück.",
    installTitle: "App installieren",
    installText: "Offline lesen, schneller starten.",
    installBtn: "Installieren"
  },
  en: {
    brandTitle: "EU AI Act Glossary",
    brandSub: "Edition 2026",
    coverEdition: "EDITION 2026 · VOLUME I",
    coverTitle: 'EU AI Act<br/><em>Glossary</em>',
    coverSubtitle: "The bilingual lexicon to Regulation (EU) 2024/1689.",
    coverPublisher: "Learning Factory",
    coverCountLabel: "terms · DE / EN",
    compactEyebrow: "Reg. (EU) 2024/1689",
    compactTitle: 'EU AI Act <em>Glossary</em>',
    searchPlaceholder: "Term, tag, keyword…",
    catAll: "All",
    cat: {
      "ai-act-core": "EU AI Act",
      "ml": "ML basics",
      "dl": "Deep learning",
      "llm": "LLM / GenAI",
      "nlp": "NLP",
      "cv": "Vision",
      "ethics": "Ethics",
      "governance": "Governance",
      "security": "Security"
    },
    risk: {
      "prohibited": "Prohibited",
      "high": "High-risk",
      "limited": "Limited",
      "minimal": "Minimal",
      "systemic": "Systemic"
    },
    statResults: "terms",
    detailKurz: "Summary",
    detailLang: "In depth",
    detailLinks: "Sources",
    emptyTitle: "No matches",
    emptyText: "Try a different keyword or reset the filters.",
    installTitle: "Install app",
    installText: "Read offline, launch faster.",
    installBtn: "Install"
  }
};

/* ==================================================================
   STATE
================================================================== */
const state = {
  lang: detectLang(),
  search: "",
  cat: "all",
  risk: "all",
  tag: null,
  current: null
};

function detectLang() {
  const saved = localStorage.getItem("glossar-lang");
  if (saved === "de" || saved === "en") return saved;
  const browser = (navigator.language || "de").toLowerCase().slice(0,2);
  return browser === "en" ? "en" : "de";
}

/* ==================================================================
   RENDER
================================================================== */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function applyI18n() {
  const t = I18N[state.lang];
  document.documentElement.lang = state.lang;
  // textContent für reine Texte
  $$("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (t[key] != null) el.textContent = t[key];
  });
  // innerHTML für Texte mit Markup (z. B. <em>, <br>)
  $$("[data-i18n-html]").forEach(el => {
    const key = el.dataset.i18nHtml;
    if (t[key] != null) el.innerHTML = t[key];
  });
  $("#searchInput").placeholder = t.searchPlaceholder;
  $$(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === state.lang));
  // Live-Begriffszähler im Cover
  const cc = $("#coverCount");
  if (cc) cc.textContent = TERMS.length;
}

function buildFilters() {
  const t = I18N[state.lang];
  const wrap = $("#filterScroll");
  const catCounts = TERMS.reduce((a, x) => (a[x.category] = (a[x.category]||0)+1, a), {});
  const riskCounts = TERMS.reduce((a, x) => (x.risk && (a[x.risk] = (a[x.risk]||0)+1), a), {});

  // Explizite Reihenfolge: EU AI Act zuerst, dann technische Kategorien, dann Querschnitt
  const CAT_ORDER = ["ai-act-core", "ml", "dl", "llm", "nlp", "cv", "ethics", "governance", "security"];

  let html = `<button class="chip ${state.cat === "all" && state.risk === "all" ? "active" : ""}" data-type="cat" data-val="all">${t.catAll} <span class="count">${TERMS.length}</span></button>`;

  CAT_ORDER.forEach(k => {
    const c = catCounts[k] || 0;
    if (!c) return;
    const label = t.cat[k] || k;
    html += `<button class="chip ${state.cat === k ? "active" : ""}" data-type="cat" data-val="${k}">${label} <span class="count">${c}</span></button>`;
  });

  if (Object.keys(riskCounts).length) {
    html += `<span class="filter-divider"></span>`;
    ["prohibited","high","limited","minimal","systemic"].forEach(r => {
      if (!riskCounts[r]) return;
      html += `<button class="chip chip-risk ${state.risk === r ? "active" : ""}" data-type="risk" data-val="${r}" data-risk="${r}">${t.risk[r]} <span class="count">${riskCounts[r]}</span></button>`;
    });
  }

  wrap.innerHTML = html;
  wrap.querySelectorAll(".chip").forEach(b => {
    b.addEventListener("click", () => {
      const type = b.dataset.type;
      const val = b.dataset.val;
      if (type === "cat") {
        state.cat = (state.cat === val) ? "all" : val;
        if (val === "all") state.risk = "all";
      } else if (type === "risk") {
        state.risk = (state.risk === val) ? "all" : val;
      }
      render();
    });
  });
}

function highlight(text, q) {
  if (!q) return text;
  const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
  return text.replace(re, "<mark>$1</mark>");
}

function filterTerms() {
  const q = state.search.trim().toLowerCase();
  return TERMS.filter(x => {
    if (state.cat !== "all" && x.category !== state.cat) return false;
    if (state.risk !== "all" && x.risk !== state.risk) return false;
    if (state.tag && !x.tags.includes(state.tag)) return false;
    if (q) {
      const blob = [
        x.de.term, x.en.term, x.de.short, x.en.short, x.de.long, x.en.long,
        ...(x.tags || [])
      ].join(" ").toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function renderCard(x) {
  const t = I18N[state.lang];
  const data = x[state.lang] || x.de;
  const q = state.search.trim();
  const riskBadge = x.risk
    ? `<span class="risk-badge"><span class="risk-dot" data-risk="${x.risk}"></span>${t.risk[x.risk]}</span>`
    : "";

  // DEBUG: zeigt sichtbar an, welche Sprachversion gerendert wird
  const debugTag = `<span style="position:absolute;top:6px;right:6px;background:#c8a96a;color:#0a1628;font:700 9px 'JetBrains Mono',monospace;padding:2px 5px;border-radius:3px;z-index:10">${state.lang.toUpperCase()}</span>`;

  return `
    <article class="term-card" data-id="${x.id}">
      ${debugTag}
      <div class="term-meta">
        <span class="cat-pill" data-cat="${x.category}">${t.cat[x.category]}</span>
        ${riskBadge}
      </div>
      <h2 class="term-title">${highlight(data.term, q)}</h2>
      <p class="term-short">${highlight(data.short, q)}</p>
      <span class="expand-hint" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </span>
    </article>
  `;
}

function render() {
  applyI18n();
  buildFilters();
  const t = I18N[state.lang];
  const list = filterTerms();
  const main = $("#main");
  const stats = $("#stats");
  stats.textContent = `${list.length} ${t.statResults}`;

  if (!list.length) {
    main.innerHTML = `<div class="stats" id="stats">${list.length} ${t.statResults}</div><div class="empty"><h3>${t.emptyTitle}</h3><p>${t.emptyText}</p></div>`;
    return;
  }

  main.innerHTML = `<div class="stats">${list.length} ${t.statResults}</div>` + list.map(renderCard).join("");

  main.querySelectorAll(".term-card").forEach(card => {
    card.addEventListener("click", () => openSheet(card.dataset.id));
  });
}

/* ==================================================================
   BOTTOM SHEET
================================================================== */
function openSheet(id) {
  const x = TERMS.find(t => t.id === id);
  if (!x) return;
  state.current = x;
  const t = I18N[state.lang];
  const data = x[state.lang] || x.de;
  const altLang = state.lang === "de" ? "en" : "de";
  const altData = x[altLang];

  const riskBadge = x.risk
    ? `<span class="risk-badge"><span class="risk-dot" data-risk="${x.risk}"></span>${t.risk[x.risk]}</span>`
    : "";

  $("#sheetHeader").innerHTML = `
    <div class="sheet-meta">
      <span class="cat-pill" data-cat="${x.category}">${t.cat[x.category]}</span>
      ${riskBadge}
    </div>
    <h2 class="sheet-title">${data.term}</h2>
    ${altData && altData.term !== data.term ? `<div class="sheet-alt">${altData.term}</div>` : ""}
  `;

  const tagsHtml = (x.tags || []).map(tag =>
    `<button class="tag ${state.tag === tag ? "active" : ""}" data-tag="${tag}">${tag}</button>`
  ).join("");

  const linksHtml = (x.links || []).length
    ? `<div class="sheet-section-label">${t.detailLinks}</div>
       <div class="sheet-links">
         ${x.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join("")}
       </div>`
    : "";

  $("#sheetBody").innerHTML = `
    <div class="sheet-section-label">${t.detailKurz}</div>
    <p class="sheet-short">${data.short}</p>
    <div class="sheet-section-label">${t.detailLang}</div>
    <p class="sheet-long">${data.long || data.short}</p>
    <div class="sheet-tags">${tagsHtml}</div>
    ${linksHtml}
  `;

  $("#sheetBody").querySelectorAll(".tag").forEach(tg => {
    tg.addEventListener("click", () => {
      const tag = tg.dataset.tag;
      state.tag = state.tag === tag ? null : tag;
      closeSheet();
      render();
    });
  });

  $("#sheet").classList.add("open");
  $("#sheet").setAttribute("aria-hidden", "false");
  $("#sheetBackdrop").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeSheet() {
  $("#sheet").classList.remove("open");
  $("#sheet").setAttribute("aria-hidden", "true");
  $("#sheetBackdrop").classList.remove("open");
  document.body.style.overflow = "";
  state.current = null;
}

$("#sheetBackdrop").addEventListener("click", closeSheet);
$("#sheetClose").addEventListener("click", closeSheet);

// Swipe-down zum Schließen
let touchStartY = 0;
$("#sheet").addEventListener("touchstart", e => {
  if (e.target.closest(".sheet-body")) return;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
$("#sheet").addEventListener("touchend", e => {
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (dy > 60) closeSheet();
}, { passive: true });

// ESC
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
});

/* ==================================================================
   EVENTS
================================================================== */
let searchTimer;
$("#searchInput").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = e.target.value;
    render();
  }, 120);
});

/* ==================================================================
   SCROLL-COLLAPSE HEADER (Cover → Compact)
================================================================== */
const topbarEl = $("#topbar");
let lastScrolled = false;
let ticking = false;
function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const y = window.scrollY || document.documentElement.scrollTop;
    // Schwellwert: Cover ist ca. 200-260px hoch — bei 60px scroll bereits einklappen
    const scrolled = y > 60;
    if (scrolled !== lastScrolled) {
      topbarEl.classList.toggle("scrolled", scrolled);
      lastScrolled = scrolled;
    }
    ticking = false;
  });
}
window.addEventListener("scroll", onScroll, { passive: true });

/* ==================================================================
   LANG-SWITCH
================================================================== */
function switchLang(newLang) {
  if (newLang !== "de" && newLang !== "en") return;
  if (newLang === state.lang) return;
  state.lang = newLang;
  try { localStorage.setItem("glossar-lang", state.lang); } catch (_) {}
  if (state.current) openSheet(state.current.id);
  render();
}

function bindLangButtons() {
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.onclick = null;
    btn.onclick = function(e) {
      e.preventDefault();
      e.stopPropagation();
      switchLang(this.dataset.lang);
    };
  });
}
bindLangButtons();
window.addEventListener("load", bindLangButtons);

/* ==================================================================
   PWA · INSTALL PROMPT + SERVICE WORKER
================================================================== */
let deferredPrompt = null;
const installBanner = $("#installBanner");
const installBtn = $("#installBtn");
const installDismiss = $("#installDismiss");

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem("install-dismissed")) {
    setTimeout(() => installBanner.classList.add("show"), 1500);
  }
});

installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  installBanner.classList.remove("show");
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});

installDismiss.addEventListener("click", () => {
  installBanner.classList.remove("show");
  localStorage.setItem("install-dismissed", "1");
});

window.addEventListener("appinstalled", () => {
  installBanner.classList.remove("show");
  deferredPrompt = null;
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("sw.js");
      // Wenn ein neuer SW wartet, sofort aktivieren und Seite neu laden
      if (reg.waiting) {
        reg.waiting.postMessage("SKIP_WAITING");
      }
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) {
            // Neuer SW ist bereit
            nw.postMessage("SKIP_WAITING");
          }
        });
      });
      // Wenn der aktive SW wechselt, einmalig nachladen
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    } catch (err) {
      console.warn("SW reg failed:", err);
    }
  });
}

/* ==================================================================
   CACHE-RESET via ?reset URL-Parameter
   Aufruf: https://...github.io/repo/?reset
   Räumt alle Caches und Service Worker ab, lädt frisch.
================================================================== */
if (window.location.search.includes("reset")) {
  (async () => {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    try { localStorage.clear(); } catch(_) {}
    // Redirect ohne ?reset, damit der Reload eine saubere Seite holt
    window.location.replace(window.location.pathname);
  })();
}

/* ==================================================================
   BOOT
================================================================== */
if (typeof TERMS === "undefined") {
  document.body.innerHTML = '<div style="padding:48px;font-family:system-ui">Fehler: <code>terms.js</code> nicht gefunden.</div>';
} else {
  render();
}
</script>
</body>
</html>
